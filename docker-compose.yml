services:
  api:
    build: .
    env_file: .env
    environment:
      CHROMA_DATA_PATH: /app/data/chroma
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # The prebuilt, read-only-for-the-app Pokémon index is intentionally
      # supplied at runtime rather than committed to source control.
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  client:
    build:
      context: ./client
    environment:
      # This URL is used only by Next.js Server Actions, never sent to the browser.
      POKEMON_API_BASE_URL: http://api:8000
    ports:
      - "${CLIENT_HOST_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
