name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Install client dependencies
        working-directory: client
        run: bun ci
      - name: Lint client
        working-directory: client
        run: bun run lint
      - name: Build client
        working-directory: client
        run: bun run build
      - name: Run tests
        run: make test
        env:
          ANTHROPIC_API_KEY: test
          COHERE_API_KEY: test
      - name: Build API deployment image
        run: docker build --tag whosthatpokemon-api:ci .
      - name: Build client deployment image
        run: docker build --tag whosthatpokemon-client:ci ./client
