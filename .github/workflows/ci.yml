name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Run tests
        run: make test
        env:
          ANTHROPIC_API_KEY: test
          COHERE_API_KEY: test
      - name: Build deployment image
        run: docker build --tag whosthatpokemon-api:ci .
